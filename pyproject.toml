[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendfollow-research"
version = "0.1.0"
description = "End-of-day trend screening and risk planning for Korean stocks"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "requests>=2.31,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "websocket-client>=1.8,<2"]
intraday = ["websocket-client>=1.8,<2"]
dev = ["black==26.10.1"]

[project.scripts]
trendfollow = "trendfollow.cli:main"

[tool.setuptools.packages.find]
include = ["trendfollow*"]

[tool.setuptools.package-data]
trendfollow = ["web/*.html", "web/*.js", "web/*.css", "web/manifest.json", "web/src/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
