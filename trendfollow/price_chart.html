<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; font: 13px system-ui, sans-serif; color: #24334a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    .frame { border: 1px solid #d4deeb; border-radius: 8px; overflow: hidden; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 8px 10px; border-bottom: 1px solid #e2e9f2; }
    .tools span { color: #66768c; margin: 0 5px 0 7px; }
    button { border: 1px solid #cad6e5; border-radius: 5px; padding: 4px 8px; background: #fff; color: #254266; cursor: pointer; font: inherit; }
    button:hover { border-color: #2962b8; }
    button[aria-pressed="true"] { background: #e7f0ff; border-color: #3468bd; color: #174a97; font-weight: 600; }
    #plot-wrap { position: relative; height: 470px; }
    #plot { width: 100%; height: 100%; }
    #legend { position: absolute; left: 10px; top: 8px; z-index: 2; max-width: calc(100% - 115px); padding: 5px 8px; border-radius: 4px; background: rgba(255,255,255,.91); color: #233750; pointer-events: none; font-size: 12px; line-height: 1.45; }
    .foot { padding: 5px 10px; color: #697b91; font-size: 11px; border-top: 1px solid #e2e9f2; }
    .foot a { color: #466da4; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="tools" aria-label="차트 보기 설정">
      <button type="button" data-kind="candle" aria-pressed="true">캔들</button>
      <button type="button" data-kind="line" aria-pressed="false">종가 선</button>
      <span>기간</span>
      <button type="button" data-months="1" aria-pressed="false">1개월</button>
      <button type="button" data-months="3" aria-pressed="false">3개월</button>
      <button type="button" data-months="6" aria-pressed="true">6개월</button>
      <button type="button" data-months="12" aria-pressed="false">12개월</button>
      <button type="button" data-months="15" aria-pressed="false">15개월</button>
      <button type="button" data-months="all" aria-pressed="false">전체</button>
    </div>
    <div id="plot-wrap"><div id="plot"></div><div id="legend" aria-live="off"></div></div>
    <div class="foot">저장된 완료 일봉 · 차트에서 드래그해 이동하고 마우스 휠로 확대·축소 · Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a></div>
  </div>
  <script>/*__LIGHTWEIGHT_CHARTS__*/</script>
  <script>
  (() => {
    const rows = /*__CHART_DATA__*/;
    if (!rows.length) return;
    const byDate = new Map(rows.map(row => [row.time, row]));
    const plot = document.getElementById('plot');
    const legend = document.getElementById('legend');
    const chart = LightweightCharts.createChart(plot, {
      autoSize: true,
      layout: { background: { type: 'solid', color: '#ffffff' }, textColor: '#64748b', attributionLogo: true },
      grid: { vertLines: { color: '#eef2f7' }, horzLines: { color: '#eef2f7' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: {
        borderColor: '#d4deeb', timeVisible: false, rightOffset: 2,
        tickMarkFormatter: time => {
          const day = typeof time === 'string' ? time :
            `${time.year}-${String(time.month).padStart(2, '0')}-${String(time.day).padStart(2, '0')}`;
          return day.slice(5).replace('-', '/');
        },
      },
      rightPriceScale: { borderColor: '#d4deeb', scaleMargins: { top: 0.16, bottom: 0.06 } },
      localization: { locale: 'ko-KR' },
    });
    const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#b33f38', downColor: '#276eaa', borderVisible: false,
      wickUpColor: '#b33f38', wickDownColor: '#276eaa',
    });
    const line = chart.addSeries(LightweightCharts.LineSeries, { color: '#255bc1', lineWidth: 2, visible: false });
    const volume = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: 'volume' }, color: '#a8bfd8',
    }, 1);
    chart.panes()[0].setStretchFactor(3);
    chart.panes()[1].setStretchFactor(1);
    candles.setData(rows.map(r => ({ time: r.time, open: r.open, high: r.high, low: r.low, close: r.close })));
    line.setData(rows.map(r => ({ time: r.time, value: r.close })));
    volume.setData(rows.filter(r => r.volume !== null).map(r => ({
      time: r.time, value: r.volume, color: r.close >= r.open ? '#e1aaa5' : '#a8bfd8'
    })));
    const number = value => value === null || value === undefined ? '자료 없음' :
      Number(value).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    const multiple = value => value === null || value === undefined ? '자료 없음' : `${Number(value).toFixed(2)}배`;
    function show(row) {
      legend.textContent = `${row.time}  시 ${number(row.open)}  고 ${number(row.high)}  저 ${number(row.low)}  종 ${number(row.close)}원` +
        `  ·  거래량 ${number(row.volume)} (직전 20일 평균 대비 ${multiple(row.volume_ratio)})  ·  ATR ${number(row.atr)}` +
        `  ·  상승변동 ${multiple(row.atr_up_multiple)} / 하락변동 ${multiple(row.atr_down_multiple)}`;
    }
    show(rows[rows.length - 1]);
    chart.subscribeCrosshairMove(param => {
      const time = param.time;
      const day = typeof time === 'string' ? time : time &&
        `${time.year}-${String(time.month).padStart(2, '0')}-${String(time.day).padStart(2, '0')}`;
      show(byDate.get(day) || rows[rows.length - 1]);
    });
    function setRange(months) {
      if (months === 'all') { chart.timeScale().fitContent(); return; }
      const last = rows[rows.length - 1].time;
      const start = new Date(`${last}T00:00:00Z`);
      start.setUTCMonth(start.getUTCMonth() - Number(months));
      const first = rows[0].time;
      chart.timeScale().setVisibleRange({ from: start.toISOString().slice(0, 10) < first ? first : start.toISOString().slice(0, 10), to: last });
    }
    document.querySelectorAll('[data-months]').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('[data-months]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      setRange(button.dataset.months);
    }));
    document.querySelectorAll('[data-kind]').forEach(button => button.addEventListener('click', () => {
      const candle = button.dataset.kind === 'candle';
      candles.applyOptions({ visible: candle });
      line.applyOptions({ visible: !candle });
      document.querySelectorAll('[data-kind]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
    requestAnimationFrame(() => setRange(6));
  })();
  </script>
</body>
</html>
